<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Configuración general */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            color: #333;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        /* Contenedor principal */
        body > h1 {
            display: none;
        }

        form {
            background: white;
            width: 420px;
            padding: 30px;
            border-radius: 12px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        }

        /* Título */
        form::before {
            content: "Productos";
            display: block;
            text-align: center;

            font-size: 28px;
            font-weight: bold;
            color: #222;

            margin-bottom: 25px;
        }

        /* Campos */
        p {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;

            font-weight: bold;
            color: #444;
        }

        input {
            width: 100%;
            padding: 11px 12px;

            border: 1px solid #ccc;
            border-radius: 7px;

            font-size: 15px;
            outline: none;

            transition: 0.3s;
        }

        /* Cuando seleccionamos un input */
        input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 5px rgba(37, 99, 235, 0.25);
        }

        /* Botón */
        button {
            width: 100%;
            padding: 12px;

            border: none;
            border-radius: 7px;

            background: #2563eb;
            color: white;

            font-size: 16px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        /* Enlace */
        a {
            display: block;

            margin-top: 18px;
            padding: 11px;

            text-align: center;
            text-decoration: none;

            color: #2563eb;
            border: 1px solid #2563eb;
            border-radius: 7px;

            transition: 0.3s;
        }

        a:hover {
            background: #2563eb;
            color: white;
        }
    </style>
    
</head>
<body>
    <h1>Productos</h1>
    <form method="post">
        {% csrf_token %}
        <p>
            <label> Nombre:</label><br>
            <input type="text" name="nombre" value="{{producto.nombre|default:''}}" required>
        </p>
        <p>
            <label> Categoria:</label><br>
            <input type="text" name="categoria" value="{{producto.categoria|default:''}}" required>
        </p>
        <p>
            <label> Precio:</label><br>
            <input type="number" name="precio" value="{{producto.precio|default:''}}" required>
        </p>
        <p>
            <label> Cantidad:</label><br>
            <input type="number" name="cantidad" value="{{producto.cantidad|default:''}}" required>
        </p>
        <p>
            <label> Estado:</label><br>
            <input type="text" name="estado" value="{{producto.estado|default:''}}" required>
        </p>
        <button type="submit">Enviar</button>
        
        <a href="/productos/lista/">
        Listado de Productos
        </a>
    </form>
</body>
</html>
